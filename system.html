<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<!-- Dynamic title -->
<script>
  const params = new URLSearchParams(window.location.search);
  const sys = params.get("system") || params.get("pdb") || null;
  document.title = sys ? (sys.toUpperCase() + ": Analysis") : "MD Viewer Platform";
</script>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>
  /* Basic layout */
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f9f9f9;
    overflow: hidden;
  }

  #main-container {
    display: flex;
    width: 100vw;
    height: 100vh;
  }

  #left-container {
    flex: 0 0 40%;
    max-width: 40%;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 10px;
    box-sizing: border-box;
  }

  #replica-card {
    display: flex;
    flex-direction: column;
  }

  #viewer-container {
    flex: 1 1 auto;
    min-height: 0;
  }


  .left-card {
    /* each left-card will take half the available height of left-container (js-friendly) */
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-sizing: border-box;
    min-height: 0;
  }

  /* RIGHT COLUMN: system info (20%) + ranked pockets (80%) */
  #right-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px;
    box-sizing: border-box;
    background: #f0f0f0;
    gap: 8px;
  }

  .card {
    box-sizing: border-box;
    background: white;
    border-radius: 8px;
    padding: 8px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    border: 1px solid #ddd;
  }
  .card-header {
    font-weight: bold;
    text-align: center;
    margin-bottom: 6px;
  }

  /* Viewer container (black background where NGL stage mounts) */
  .viewer-box {
    border: 1px solid #ccc;
    background: #000;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;   /* center square viewer horizontally/vertically */
    justify-content: center;
    min-height: 0;
    flex: 1 1 0;
  }

  /* the inner stage element will get an id and be sized by JS */
  .inner-stage {
    width: 100%;
    height: 100%;
  }

  /* tabs (replica selector) */
  #tabs { width: 100%; display: flex; gap: 8px; margin-bottom: 8px; }
  .tab-button {
    flex: 1;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    border: 1px solid #ccc;
    background: #eee;
    font-weight: bold;
    user-select: none;
    border-radius: 4px;
  }
  .tab-button.active { background: white; }

  /* Controls overlay style (shared) */
  .controls-box {
    position: absolute;
    z-index: 40;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    gap: 10px;
    align-items: justify;
    background: rgba(0,0,0,0.15);
    padding: 0px;
    border-radius: 6px;
  }
  #traj-controls {
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    backdrop-filter: blur(2px);
  }
  #traj-controls button {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  #traj-controls input[type=range] { width: 220px; }

  #view-controls {
    top: 10px;
    right: 10px;
    flex-wrap: wrap;
  }
  #view-controls button {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    background: none;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px;
    color: white;
    padding: 6px 8px;
    font-size: 14px;
  }
  .material-icons { font-size: 20px; }

  /* Right column tab layout: fixed 20% + 80% */
  #system-info-tab { flex: 0 0 20%; display:flex; flex-direction:column; }
  #ranked-pockets-tab { flex: 1 1 0; display:flex; flex-direction:column; gap:8px; }

  /* inside ranked pockets: table area + nanoshaper viewer */
  #pockets-table-container {
    box-sizing: border-box;
    background: white;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 8px;
    overflow: auto;
    flex: 0 0 auto; /* height controlled in JS to split with viewer */
  }

  #nanoshaper-viewer {
    flex: 1 1 0;
    box-sizing: border-box;
    background: #000;
    border: 1px solid #ccc;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* table */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table th, table td { padding: 6px; border: 1px solid #ddd; text-align: left; vertical-align: top; }
  thead th { background: #f6f6f6; font-weight: 600; }

  /* ensure left column height matches viewport (accounting for small paddings) */
  @media (max-width: 900px) {
    #main-container { flex-direction: column; }
    #left-container { width: 100%; }
    #right-container { width: 100%; height: 40vh; }
    #system-info-tab { flex-basis: 20%; }
  }
  
  /* Download button for pockets table (also used for the hot spots button*/
  
  .ranked-pockets-header {
    display: flex;
    align-items: center;          /* vertical alignment of title + button */
    justify-content: space-between;
    width: 100%;
  }

  #download-pockets-csv {
    display: inline-flex;         /* center icon + text */
    align-items: center;
    justify-content: center;
    gap: 4px;                     /* small space between icon and text */
  }
  
  #download-hot-spots-pdb {
    display: inline-flex;         /* center icon + text */
    align-items: center;
    justify-content: center;
    gap: 4px;                     /* small space between icon and text */
  }

  #download-aa-structure-pdb {
    display: inline-flex;         /* center icon + text */
    align-items: center;
    justify-content: center;
    gap: 4px;                     /* small space between icon and text */
  }

</style>
</head>
<body>

<div id="main-container">
  <div id="left-container">
    <div class="left-card card" id="replica-card">
      <div class="card-header">CG-MD (stride = 10000 frames)</div>
      <div id="tabs">
        <div class="tab-button active" data-replica="1">Replica 1</div>
        <div class="tab-button" data-replica="2">Replica 2</div>
      </div>

      <!-- viewer box: inside it we mount a stage element with id "viewer-stage" (JS) -->
      <div id="viewer-container" class="viewer-box" style="padding:0;">
        <div id="viewer-stage" class="inner-stage"></div>
      </div>
    </div>

    <div class="left-card card" id="agg-card">
      <div class="card-header ranked-pockets-header">Detected hot spots
        <button id="download-aa-structure-pdb" class="download-btn">
          <i class="material-icons">download</i>
           Aligned structure (.pdb)
        </button>
      
        <button id="download-hot-spots-pdb" class="download-btn">
          <i class="material-icons">download</i>
           Hot Spots (.pdb)
        </button>
        
      </div>
      <div id="agg-viewer-container" class="viewer-box" style="padding:0;">
        <div id="agg-stage" class="inner-stage"></div>
      </div>
    </div>
  </div>

  <div id="right-container">
    <div id="system-info-tab" class="data-tab card">
      <div class="data-tab-content" style="flex:1;">
        <p>System Information</p>
      </div>
    </div>

    <div id="ranked-pockets-tab" class="data-tab">
      <div class="card card-header ranked-pockets-header" style="margin:0; padding:6px; text-align:left;"><span>Top 5 scoring NanoShaper pockets</span>
        <button id="download-pockets-csv" class="download-btn">
          <i class="material-icons">download</i>
           Download Full Table
        </button>
      </div>
      <div id="pockets-table-container">
        <p>Loading pockets...</p>
      </div>

      <div id="nanoshaper-viewer" class="card">
        <div id="ns-stage" class="inner-stage" style="width:100%; height:100%;"></div>
      </div>
    </div>
  </div>
</div>

<!-- NGL and our viewer script -->
<script src="https://cdn.jsdelivr.net/npm/ngl@2.4.0/dist/ngl.js"></script>
<script src="static/js/replicaViewer.js"></script>
<script src="static/js/aggregatedViewer.js"></script>
<script src="static/js/pocketsViewer.js"></script>
<script src="static/js/systemInfo.js"></script>
<script src="static/js/downloadHotSpots.js"></script>


</body>
</html>
